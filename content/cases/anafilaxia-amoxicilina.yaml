slug: anafilaxia-amoxicilina
title: "Anafilaxia após uso de amoxicilina em mulher de 24 anos"
category: "Alergia/Emergência"
disclaimer: >
  Material didático baseado em condutas de referência WAO/EAACI para anafilaxia,
  elaborado com auxílio de IA e AINDA NÃO revisado por um preceptor responsável.
  Deve ser confrontado com os protocolos institucionais vigentes antes de
  qualquer uso além de simulação/estudo.

baseCase:
  narrative: >
    Mulher, 24 anos, sem comorbidades conhecidas, tomou amoxicilina prescrita
    para infecção dentária. Vinte minutos depois, desenvolveu urticária
    generalizada, angioedema de lábios e língua, e dificuldade para respirar.
    Procurou o pronto-socorro acompanhada.
  vitals: { pa: "100/60", fc: 110, spo2: 94 }
  initialConductSeconds: 150

evolutions:
  - id: "2.A"
    direction: piora
    narrative: >
      Enquanto aguarda avaliação, a paciente desenvolve estridor, rouquidão e
      piora do edema de língua, com esforço respiratório visível.
    vitals: { pa: "94/58", fc: 122, spo2: 90 }
    options:
      - id: a1
        text: "Administrar adrenalina IM (1:1000, 0,3–0,5 mg) na face anterolateral da coxa imediatamente."
        correct: true
        rationale: "É o tratamento de primeira linha e mais importante na anafilaxia; a via IM na coxa tem absorção mais rápida e confiável."
      - id: a2
        text: "Preparar via aérea avançada (acionar anestesia/considerar intubação precoce) diante do estridor."
        correct: true
        rationale: "O edema de via aérea progride rapidamente; uma via aérea definitiva precoce evita uma via aérea de emergência mais adiante, em condições piores."
      - id: a3
        text: "Oferecer oxigênio suplementar em alto fluxo."
        correct: true
        rationale: "Sustenta a oxigenação enquanto o edema de via aérea e o quadro sistêmico evoluem."
      - id: a4
        text: "Administrar anti-histamínico IV ou oral como tratamento principal e inicial."
        correct: false
        critical: true
        rationale: "Anti-histamínicos não revertem as manifestações potencialmente fatais da anafilaxia (via aérea/respiração/circulação); atrasar a adrenalina por isso é o erro mais perigoso no manejo da anafilaxia."
      - id: a5
        text: "Observar por alguns minutos antes de aplicar adrenalina, para 'confirmar' que é anafilaxia."
        correct: false
        rationale: "Qualquer atraso na adrenalina aumenta o risco de obstrução fatal de via aérea ou choque."
      - id: a6
        text: "Aplicar adrenalina em bólus IV, na mesma dose usada para via IM."
        correct: false
        rationale: "Adrenalina IV em bólus e não diluída tem alto risco de arritmia letal ou crise hipertensiva; se necessária pela via IV, deve ser diluída e infundida, nunca em bólus na dose IM."

  - id: "2.B"
    direction: piora
    narrative: >
      Após melhora inicial com a adrenalina e período de observação, a paciente
      apresenta recorrência dos sintomas cerca de 6 horas depois — urticária,
      sibilância e hipotensão — sem nova exposição ao alérgeno.
    vitals: { pa: "88/54", fc: 118, spo2: 92 }
    options:
      - id: b1
        text: "Reconhecer como reação bifásica e administrar nova dose de adrenalina IM."
        correct: true
        rationale: "A reação bifásica é tratada da mesma forma que o episódio inicial; a adrenalina permanece a primeira linha."
      - id: b2
        text: "Prolongar o período de observação/internação (por exemplo, 24 horas)."
        correct: true
        rationale: "Reações bifásicas podem ocorrer até 72 horas depois em uma minoria dos casos; a paciente precisa de uma janela de observação maior do que a inicialmente planejada."
      - id: b3
        text: "Reavaliar via aérea, respiração e circulação (ABC) do zero, como se fosse um novo episódio."
        correct: true
        rationale: "A reação bifásica pode ser tão grave quanto ou mais grave que a inicial; exige reavaliação completa, não a suposição de que será leve."
      - id: b4
        text: "Dar alta à paciente, já que 'a reação já tinha resolvido uma vez'."
        correct: false
        critical: true
        rationale: "É uma falsa segurança que ignora o risco de recorrência bifásica; pode levar à morte fora de ambiente monitorado."
      - id: b5
        text: "Tratar a recorrência apenas com anti-histamínico oral, já que 'agora é só urticária'."
        correct: false
        rationale: "Subtrata uma reação sistêmica ao focar apenas nos sintomas cutâneos, ignorando a sibilância e a hipotensão presentes."
      - id: b6
        text: "Atribuir a recorrência à ansiedade e evitar nova dose de adrenalina."
        correct: false
        rationale: "Descartar uma reação bifásica real atrasa um tratamento potencialmente salvador."

  - id: "2.C"
    direction: piora
    narrative: >
      Apesar de doses repetidas de adrenalina IM, a paciente permanece hipotensa
      e chocada. Ao revisar a história, descobre-se uso regular de propranolol
      para profilaxia de enxaqueca.
    vitals: { pa: "76/44", fc: 96, spo2: 91 }
    options:
      - id: c1
        text: "Administrar glucagon IV."
        correct: true
        rationale: "O glucagon contorna o bloqueio beta-adrenérgico por uma via alternativa (AMPc), restaurando efeito inotrópico/cronotrópico na anafilaxia refratária por betabloqueador."
      - id: c2
        text: "Iniciar ressuscitação volêmica agressiva com cristaloide IV."
        correct: true
        rationale: "O choque anafilático envolve vasodilatação maciça e extravasamento capilar; grandes volumes de fluido são essenciais, especialmente quando a resposta à adrenalina está diminuída."
      - id: c3
        text: "Iniciar/titular infusão contínua de adrenalina IV sob monitorização, em vez de apenas repetir doses IM."
        correct: true
        rationale: "Em choque refratário, a infusão contínua permite entrega mais confiável e titulável do que repetir bólus IM que já falharam."
      - id: c4
        text: "Continuar repetindo a mesma dose de adrenalina IM, esperando a mesma resposta, sem escalonar a conduta."
        correct: false
        critical: true
        rationale: "Em paciente com bloqueio beta pelo propranolol, repetir a mesma dose IM ignora a razão farmacológica da falha terapêutica e desperdiça tempo crítico em choque refratário."
      - id: c5
        text: "Administrar broncodilatador beta-agonista inalatório isoladamente como tratamento principal do choque."
        correct: false
        rationale: "Trata apenas o broncoespasmo, sem abordar a hipotensão/choque, e não substitui glucagon e volume."
      - id: c6
        text: "Reter o glucagon por risco de náusea/vômito, aguardando outra alternativa."
        correct: false
        rationale: "O risco do choque refratário não tratado supera muito os efeitos colaterais do glucagon; reter essa droga atrasa o único fármaco que reverte o efeito do betabloqueio."

scoring:
  perOptionCorrectlyClassified: 1
  criticalIdentificationBonus: 2
  perEvolutionMax: 8
