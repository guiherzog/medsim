slug: sepse-urinaria-idoso
title: "Sepse de foco urinário em homem de 72 anos"
category: "Emergência/UTI"
disclaimer: >
  Material didático baseado nas diretrizes da Surviving Sepsis Campaign,
  elaborado com auxílio de IA e AINDA NÃO revisado por um preceptor responsável.
  Deve ser confrontado com os protocolos institucionais vigentes antes de
  qualquer uso além de simulação/estudo.

briefing:
  patient: "Homem, 72 anos"
  patientDetail: >
    Febre, confusão mental aguda e hipotensão · urina e urocultura compatíveis
    com pielonefrite · diagnóstico de sepse de foco urinário
  meta: "~4 min · difícil · choque séptico e SDRA"
  admissionVitals: { pa: "90/50", fc: 118, spo2: 93, fr: 24 }
  note: "Você conduz em tempo real. Cada decisão altera os vitais — e a demora também."

steps:
  - id: "3.A"
    event: >
      Apesar de bólus de cristaloide (30 mL/kg), o paciente permanece hipotenso,
      com extremidades frias e tempo de enchimento capilar prolongado.
    prompt: "Hipotensão refratária a volume. Conduta?"
    vitals: { pa: "78/45", fc: 124, spo2: 92, fr: 26 }
    criticalVital: pa
    decisionSeconds: 30
    timeout:
      feed: "Nenhuma conduta. A hipoperfusão persiste e a acidose progride."
      target: { pa: "68/40", fc: 132, spo2: 89, fr: 30 }
      criticalVital: pa
    options:
      - id: a1
        label: "Iniciar noradrenalina, com meta de PAM ≥ 65 mmHg"
        correct: true
        rationale: >
          Vasopressor de primeira linha no choque séptico refratário a volume,
          conforme a Surviving Sepsis Campaign.
        feed: "Noradrenalina iniciada e titulada. A PA sobe e a perfusão periférica melhora."
        target: { pa: "104/62", fc: 104, spo2: 95, fr: 22 }
        criticalVital: null
        next: "3.B"
      - id: a2
        label: "Garantir hemoculturas e antibiótico de amplo espectro na primeira hora"
        correct: true
        rationale: >
          Antibiótico precoce e controle de foco são elementos centrais do pacote
          de sepse; o atraso aumenta a mortalidade.
        feed: "Culturas colhidas e antibiótico administrado. O foco começa a ser tratado."
        target: { pa: "84/50", fc: 118, spo2: 93, fr: 25 }
        criticalVital: pa
        next: "3.B"
      - id: a3
        label: "Manter bólus repetidos de cristaloide, sem vasopressor"
        correct: false
        critical: true
        rationale: >
          Atrasa o vasopressor no choque refratário a volume, prolongando a
          hipoperfusão e somando risco de sobrecarga hídrica.
        feed: "Mais volume, sem vasopressor. A PA não responde e surge congestão pulmonar."
        target: { pa: "66/38", fc: 134, spo2: 86, fr: 32 }
        criticalVital: pa
        clip: "Choque séptico: quando iniciar o vasopressor"
        next: "3.B"
      - id: a4
        label: "Iniciar dopamina como vasopressor de primeira linha"
        correct: false
        rationale: >
          A dopamina associa-se a mais arritmias e não é mais recomendada como
          primeira linha frente à noradrenalina.
        feed: "Dopamina iniciada. A PA sobe pouco e surgem extrassístoles frequentes."
        target: { pa: "88/52", fc: 138, spo2: 91, fr: 26 }
        criticalVital: fc
        next: "3.B"

  - id: "3.B"
    event: >
      Vinte e quatro horas depois, já em ventilação mecânica, o paciente
      apresenta piora da hipoxemia com infiltrados bilaterais e relação
      PaO2/FiO2 de 150 — SDRA moderada.
    prompt: "SDRA moderada em ventilação mecânica. Ajuste ventilatório?"
    vitals: { pa: "104/64", fc: 98, spo2: 89, fr: 28 }
    criticalVital: spo2
    decisionSeconds: 30
    timeout:
      feed: "Ventilação inalterada. A hipoxemia persiste sem estratégia protetora."
      target: { pa: "100/60", fc: 104, spo2: 85, fr: 30 }
      criticalVital: spo2
    options:
      - id: b1
        label: "Ventilação protetora: volume corrente ~6 mL/kg de peso predito, platô < 30 cmH2O"
        correct: true
        rationale: >
          Reduz a lesão pulmonar induzida pelo ventilador e melhora a sobrevida
          na SDRA (protocolo ARDSNet).
        feed: "Ventilação protetora ajustada. A oxigenação melhora progressivamente."
        target: { pa: "108/66", fc: 88, spo2: 95, fr: 20 }
        criticalVital: null
        next: "3.C"
      - id: b2
        label: "Considerar posição prona pela hipoxemia persistente"
        correct: true
        rationale: >
          A pronação melhora a oxigenação e a mortalidade em SDRA moderada a
          grave (estudo PROSEVA).
        feed: "Paciente pronado. A oxigenação responde nas horas seguintes."
        target: { pa: "106/64", fc: 92, spo2: 94, fr: 22 }
        criticalVital: null
        next: "3.C"
      - id: b3
        label: "Aumentar o volume corrente para 10–12 mL/kg para melhorar a oxigenação"
        correct: false
        critical: true
        rationale: >
          Volumes correntes altos pioram a lesão pulmonar induzida pelo
          ventilador e aumentam a mortalidade na SDRA.
        feed: "Volume corrente elevado. A pressão de platô sobe e a hipoxemia piora."
        target: { pa: "96/58", fc: 112, spo2: 83, fr: 32 }
        criticalVital: spo2
        clip: "SDRA: por que volume corrente alto mata"
        next: "3.C"

  - id: "3.C"
    event: >
      Dias depois a oxigenação melhorou, o paciente está estável sem vasopressor
      e a equipe considera o desmame da ventilação mecânica.
    prompt: "Paciente estável, candidato a desmame. Conduta?"
    vitals: { pa: "118/72", fc: 82, spo2: 96, fr: 16 }
    criticalVital: null
    decisionSeconds: 45
    timeout:
      feed: "Nenhuma definição. O paciente segue intubado sem avaliação de prontidão."
      target: { pa: "116/70", fc: 86, spo2: 95, fr: 17 }
      criticalVital: null
    options:
      - id: c1
        label: "Realizar teste de respiração espontânea antes de extubar"
        correct: true
        rationale: >
          O TRE é a avaliação padrão de prontidão para extubação e reduz falha de
          extubação.
        feed: "TRE realizado e bem tolerado. Extubação programada com segurança."
        target: { pa: "120/74", fc: 80, spo2: 97, fr: 16 }
        criticalVital: null
        next: null
      - id: c2
        label: "Manter o antibiótico pelo tempo total adequado ao foco urinário"
        correct: true
        rationale: >
          A suspensão precoce arrisca recidiva e controle inadequado do foco,
          mesmo com melhora respiratória.
        feed: "Antibiótico mantido pelo curso completo. Sem sinais de recidiva."
        target: { pa: "119/73", fc: 82, spo2: 96, fr: 16 }
        criticalVital: null
        next: null
      - id: c3
        label: "Extubar imediatamente, já que a oxigenação está boa"
        correct: false
        critical: true
        rationale: >
          Pular o TRE arrisca falha de extubação e reintubação, com
          morbimortalidade significativa num paciente pós-SDRA.
        feed: "Extubação sem teste de prontidão. Em duas horas há esforço respiratório e necessidade de reintubação."
        target: { pa: "104/62", fc: 116, spo2: 88, fr: 30 }
        criticalVital: spo2
        clip: "Desmame: por que o TRE não se pula"
        next: null

scoring:
  pointsPerCorrectDecision: 10
  criticalErrorPenalty: 5
  timeoutPenalty: 5
