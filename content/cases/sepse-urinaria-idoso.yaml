slug: sepse-urinaria-idoso
title: "Sepse de foco urinário em homem de 72 anos"
category: "Emergência/UTI"
disclaimer: >
  Material didático baseado nas diretrizes da Surviving Sepsis Campaign,
  elaborado com auxílio de IA e AINDA NÃO revisado por um preceptor
  responsável. Deve ser confrontado com os protocolos institucionais
  vigentes antes de qualquer uso além de simulação/estudo.

baseCase:
  narrative: >
    Homem, 72 anos, trazido ao pronto-socorro com febre, confusão mental
    aguda e hipotensão. Exame de urina e urocultura compatíveis com
    infecção urinária/pielonefrite. Diagnóstico: sepse de foco urinário.
  vitals: { pa: "90/50", fc: 118, spo2: 93 }
  initialConductSeconds: 150

evolutions:
  - id: "3.A"
    direction: piora
    narrative: >
      Apesar de bólus de cristaloide (30 mL/kg), o paciente permanece
      hipotenso, com PA 78/45 mmHg, extremidades frias e tempo de
      enchimento capilar prolongado.
    vitals: { pa: "78/45", fc: 124, spo2: 92 }
    options:
      - id: a1
        text: "Iniciar noradrenalina como vasopressor de primeira linha."
        correct: true
        rationale: "Segundo a Surviving Sepsis Campaign, a noradrenalina é o vasopressor de primeira linha no choque séptico refratário a volume, com meta de PAM ≥65 mmHg."
      - id: a2
        text: "Garantir hemoculturas coletadas e antibioticoterapia de amplo espectro já administrada dentro da primeira hora."
        correct: true
        rationale: "Controle de foco e antibióticos precoces são elementos centrais do pacote de sepse; o atraso aumenta a mortalidade."
      - id: a3
        text: "Reavaliar o status volêmico (ou usar parâmetros dinâmicos) antes de assumir vasoplegia pura."
        correct: true
        rationale: "Confirma que a refratariedade a fluidos é real antes de migrar totalmente para vasopressor, evitando tanto sub quanto sobre-ressuscitação."
      - id: a4
        text: "Continuar administrando bólus ilimitados de cristaloide em vez de iniciar vasopressor."
        correct: false
        critical: true
        rationale: "Atrasar o vasopressor no choque séptico refratário a volume prolonga a hipoperfusão de órgãos e aumenta o risco de sobrecarga hídrica (edema pulmonar, piora de eventual SDRA)."
      - id: a5
        text: "Iniciar dopamina como vasopressor de primeira linha."
        correct: false
        rationale: "A dopamina associa-se a mais arritmias e não é mais recomendada como primeira linha frente à noradrenalina no choque séptico."
      - id: a6
        text: "Aguardar o resultado das culturas antes de iniciar o antibiótico."
        correct: false
        rationale: "O antibiótico empírico de amplo espectro não deve ser postergado pela espera de culturas; deve ser iniciado imediatamente após a coleta."

  - id: "3.B"
    direction: piora
    narrative: >
      Vinte e quatro horas depois, já em ventilação mecânica, o paciente
      apresenta piora da hipoxemia com infiltrados bilaterais na radiografia
      de tórax e relação PaO2/FiO2 de 150, compatível com SDRA moderada.
    vitals: { pa: "104/64", fc: 98, spo2: 89 }
    options:
      - id: b1
        text: "Utilizar ventilação com baixo volume corrente (cerca de 6 mL/kg de peso predito)."
        correct: true
        rationale: "A ventilação protetora reduz a lesão pulmonar induzida pelo ventilador e melhora a sobrevida na SDRA (protocolo ARDSNet)."
      - id: b2
        text: "Manter a pressão de platô abaixo de 30 cmH2O."
        correct: true
        rationale: "Limita a hiperdistensão alveolar, um dos principais mecanismos de lesão pulmonar induzida pelo ventilador."
      - id: b3
        text: "Considerar posição prona diante de hipoxemia persistente em SDRA moderada a grave."
        correct: true
        rationale: "A pronação melhora a oxigenação e a mortalidade em SDRA moderada a grave (estudo PROSEVA)."
      - id: b4
        text: "Usar volumes correntes altos (10–12 mL/kg) para 'melhorar a oxigenação mais rápido'."
        correct: false
        critical: true
        rationale: "Volumes correntes altos pioram a lesão pulmonar induzida pelo ventilador e aumentam a mortalidade na SDRA — é o erro ventilatório mais perigoso neste cenário."
      - id: b5
        text: "Infundir fluidos de forma agressiva para 'sustentar a pressão arterial', sem reavaliar o status volêmico."
        correct: false
        rationale: "O excesso de fluidos piora o edema pulmonar e a gravidade da SDRA; uma estratégia hídrica conservadora é preferível uma vez controlado o choque."
      - id: b6
        text: "Suspender totalmente a sedação para 'acordar o paciente para avaliação' apesar da assincronia com o ventilador."
        correct: false
        rationale: "Sedação inadequada em SDRA grave com assincronia ventilatória pode piorar a lesão pulmonar e a assincronia paciente-ventilador; a sedação deve ser ajustada, não interrompida abruptamente."

  - id: "3.C"
    direction: melhora
    narrative: >
      Dias depois, a oxigenação melhorou, o paciente está hemodinamicamente
      estável sem vasopressor, e a equipe considera o desmame da ventilação
      mecânica.
    vitals: { pa: "118/72", fc: 82, spo2: 96 }
    options:
      - id: c1
        text: "Realizar um teste de respiração espontânea (TRE) antes de extubar."
        correct: true
        rationale: "O TRE é a avaliação padrão para determinar a prontidão para extubação."
      - id: c2
        text: "Manter a antibioticoterapia pelo tempo total adequado para sepse de foco urinário, sem suspender só por a melhora respiratória."
        correct: true
        rationale: "A suspensão precoce do antibiótico arrisca recidiva/controle inadequado do foco, mesmo com a melhora respiratória."
      - id: c3
        text: "Iniciar mobilização e fisioterapia motora precoce, conforme tolerado."
        correct: true
        rationale: "A mobilização precoce reduz a fraqueza adquirida na UTI e melhora os desfechos funcionais em pacientes críticos em recuperação."
      - id: c4
        text: "Extubar imediatamente sem qualquer teste de respiração espontânea, só porque a oxigenação está boa."
        correct: false
        critical: true
        rationale: "Pular o TRE/critérios de prontidão arrisca falha de extubação e reintubação, que carregam morbimortalidade significativa em um paciente pós-SDRA."
      - id: c5
        text: "Suspender o antibiótico antecipadamente porque o paciente 'está melhor'."
        correct: false
        rationale: "Arrisca tratamento inadequado do foco urinário e recidiva da sepse."
      - id: c6
        text: "Manter sedação intensa durante todo o processo de desmame 'por segurança'."
        correct: false
        rationale: "A sedação desnecessariamente prolongada atrasa o desmame e aumenta o risco de ventilação mecânica prolongada."

scoring:
  perOptionCorrectlyClassified: 1
  criticalIdentificationBonus: 2
  perEvolutionMax: 8
