slug: dor-toracica-iam-vd
title: "Dor torácica em homem de 58 anos"
category: Cardiologia
disclaimer: >
  Material didático baseado em condutas de referência ACLS/AHA, elaborado com
  auxílio de IA e AINDA NÃO revisado por um preceptor responsável. Deve ser
  confrontado com os protocolos institucionais vigentes antes de qualquer uso
  além de simulação/estudo.

briefing:
  patient: "Homem, 58 anos"
  patientDetail: >
    Hipertenso, tabagista (40 maços-ano) · dor torácica opressiva há 40 min,
    irradiando para o braço esquerdo · supra de ST em DII, DIII e aVF
  meta: "~4 min · difícil · IAM de parede inferior"
  admissionVitals: { pa: "130/80", fc: 62, spo2: 96, fr: 18 }
  note: "Você conduz em tempo real. Cada decisão altera os vitais — e a demora também."

steps:
  - id: "1.A"
    event: >
      Nitrato sublingual administrado para a dor. O paciente evolui com
      hipotensão, palidez cutânea e turgência jugular. A dor persiste.
    prompt: "PA em queda após o nitrato. Qual sua conduta agora?"
    vitals: { pa: "72/40", fc: 58, spo2: 92, fr: 22 }
    criticalVital: pa
    decisionSeconds: 30
    timeout:
      feed: "Nenhuma conduta tomada. A hipotensão progride sem reposição de volume."
      target: { pa: "60/34", fc: 50, spo2: 87, fr: 27 }
      criticalVital: pa
    options:
      - id: a1
        label: "Suspender nitrato e infundir cristaloide 500 mL em bólus"
        correct: true
        rationale: >
          Repõe a pré-carga do ventrículo direito infartado, que depende de
          volume, e reverte a hipotensão induzida pelo nitrato.
        feed: "Nitrato suspenso, volume infundido. A PA responde e a perfusão periférica melhora."
        target: { pa: "104/64", fc: 72, spo2: 95, fr: 18 }
        criticalVital: null
        next: "1.B"
      - id: a2
        label: "ECG com derivações direitas (V3R–V4R)"
        correct: true
        rationale: >
          Confirma o infarto de ventrículo direito e redireciona a conduta para
          volume, evitando novas reduções de pré-carga.
        feed: "Supra em V3R–V4R confirma infarto de ventrículo direito. Conduta redirecionada para volume."
        target: { pa: "76/44", fc: 60, spo2: 92, fr: 22 }
        criticalVital: pa
        next: "1.B"
      - id: a3
        label: "Repetir nitrato sublingual para controlar a dor"
        correct: false
        critical: true
        rationale: >
          Agrava a hipotensão ao reduzir ainda mais a pré-carga de um ventrículo
          direito infartado e dependente de volume — pode precipitar choque.
        feed: "A PA despenca. O VD infartado depende de volume — o nitrato tirou a pré-carga que sustentava o débito."
        target: { pa: "58/32", fc: 48, spo2: 86, fr: 28 }
        criticalVital: pa
        clip: "Infarto de VD: por que nitrato é armadilha"
        next: "1.B"
      - id: a4
        label: "Furosemida IV presumindo congestão pulmonar"
        correct: false
        rationale: >
          Reduz a pré-carga de um paciente que precisa de volume, e não há
          evidência de congestão pulmonar neste quadro.
        feed: "Diurese em paciente que precisava de volume. A PA cai mais."
        target: { pa: "64/38", fc: 54, spo2: 89, fr: 26 }
        criticalVital: pa
        next: "1.B"

  - id: "1.B"
    event: >
      Durante o transporte para a hemodinâmica o paciente perde a consciência.
      Monitor: fibrilação ventricular. Pulso ausente.
    prompt: "Ritmo chocável, sem pulso. Próxima ação?"
    vitals: { pa: "0/0", fc: 0, spo2: 0, fr: 0 }
    criticalVital: fc
    decisionSeconds: 12
    timeout:
      feed: "Nenhum choque entregue. Cada ciclo sem desfibrilação reduz a chance de retorno da circulação."
      target: { pa: "0/0", fc: 0, spo2: 0, fr: 0 }
      criticalVital: fc
    options:
      - id: b1
        label: "Compressões e desfibrilação imediata (choque não sincronizado)"
        correct: true
        rationale: >
          Em FV sem pulso, RCP de alta qualidade e desfibrilação precoce são a
          intervenção isolada mais eficaz, conforme o ACLS.
        feed: "Choque entregue no 2º ciclo. Retorno de circulação espontânea — ritmo sinusal."
        target: { pa: "98/58", fc: 96, spo2: 94, fr: 20 }
        criticalVital: null
        next: "1.C"
      - id: b2
        label: "Cardioversão elétrica sincronizada"
        correct: false
        critical: true
        rationale: >
          A FV não tem QRS organizado para sincronizar; o aparelho não entrega o
          choque e o tempo perdido custa a chance de reversão.
        feed: "O aparelho não encontra QRS para sincronizar. Nenhum choque é entregue — segundos perdidos em ritmo chocável."
        target: { pa: "0/0", fc: 0, spo2: 0, fr: 0 }
        criticalVital: fc
        clip: "FV: desfibrilar, nunca sincronizar"
        next: "1.C"
      - id: b3
        label: "Checar pulso e ritmo com calma antes de agir"
        correct: false
        rationale: >
          Checagens devem durar menos de 10 segundos; prolongá-las interrompe as
          compressões e piora o desfecho.
        feed: "Checagem prolongada. Compressões interrompidas além dos 10 segundos recomendados."
        target: { pa: "0/0", fc: 0, spo2: 0, fr: 0 }
        criticalVital: fc
        next: "1.C"

  - id: "1.C"
    event: >
      Angioplastia com stent em coronária direita, fluxo TIMI 3. Seis horas
      depois: assintomático, orientado, hemodinamicamente estável.
    prompt: "Paciente estável no pós-procedimento. Conduta?"
    vitals: { pa: "118/76", fc: 74, spo2: 97, fr: 16 }
    criticalVital: null
    decisionSeconds: 45
    timeout:
      feed: "Nenhuma definição de conduta. O paciente segue sem plano de seguimento definido."
      target: { pa: "116/74", fc: 76, spo2: 96, fr: 17 }
      criticalVital: null
    options:
      - id: c1
        label: "Manter dupla antiagregação e monitorização contínua"
        correct: true
        rationale: >
          Prevenção secundária padrão pós-stent, e a monitorização cobre o risco
          de arritmia recorrente após parada por FV.
        feed: "Conduta mantida. Paciente segue monitorizado — risco de arritmia recorrente coberto."
        target: { pa: "120/78", fc: 72, spo2: 98, fr: 16 }
        criticalVital: null
        next: null
      - id: c2
        label: "Solicitar ecocardiograma antes de planejar a alta"
        correct: true
        rationale: >
          Avalia a fração de ejeção, orientando prognóstico e eventual indicação
          de cardiodesfibrilador implantável.
        feed: "Ecocardiograma solicitado. Fração de ejeção vai orientar o seguimento."
        target: { pa: "119/77", fc: 73, spo2: 97, fr: 16 }
        criticalVital: null
        next: null
      - id: c3
        label: "Liberar para casa hoje, já que está assintomático"
        correct: false
        critical: true
        rationale: >
          O paciente teve parada cardíaca e IAM com supra reperfundido; exige
          observação e estratificação de risco, independentemente dos sintomas.
        feed: "Alta precoce após parada cardíaca e IAM com supra reperfundido, sem estratificação nem observação."
        target: { pa: "118/76", fc: 74, spo2: 97, fr: 16 }
        criticalVital: null
        clip: "Pós-parada: por que a alta precoce mata"
        next: null

scoring:
  pointsPerCorrectDecision: 10
  criticalErrorPenalty: 5
  timeoutPenalty: 5
